name: CI

# Runs on every push and pull request, so build-and-test can be a required
# check: GitHub counts a job skipped by its if as passed, but leaves a check
# whose workflow a paths filter skipped waiting for good.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      build: ${{ steps.diff.outputs.build }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: diff
        name: Did a path the build or the bundle reads change
        # Only those paths, so a change that cannot alter the result starts no
        # macOS runner. release.yml's source check has the same list without
        # the two CI files; change both.
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if git cat-file -e "$BASE^{commit}" 2>/dev/null && git diff --quiet "$BASE" HEAD -- \
            Sources Tests Package.swift Package.resolved \
            scripts/bundle.sh scripts/Pladder.entitlements Assets \
            .github/workflows/ci.yml .github/actions/build-and-test; then
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  build-and-test:
    needs: changes
    # Runs when changes failed too, so a broken check never passes unbuilt.
    if: ${{ !cancelled() && needs.changes.outputs.build != 'false' }}
    # Pladder targets macOS 26 and needs Xcode 26.
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - id: cache
        # Dependencies only: SwiftPM recompiles a restored .build in full anyway.
        # Not in the composite action, so release.yml, which signs, never reads it.
        uses: actions/cache/restore@v6
        with:
          path: &deps |
            .build/artifacts
            .build/checkouts
            .build/repositories
            .build/workspace-state.json
          key: swiftpm-deps-${{ hashFiles('Package.resolved') }}
      - uses: ./.github/actions/build-and-test
        timeout-minutes: 30
      - name: Bundle
        # Not on pull requests: a second, release build that doubles the wait.
        # No CODESIGN_IDENTITY on purpose: the runner has no certificate, so
        # this runs the auto-detection and its ad-hoc fallback, which once
        # ended the script silently on a Mac without a certificate.
        if: github.event_name == 'push'
        run: ./scripts/bundle.sh
      - uses: actions/upload-artifact@v7
        if: github.event_name == 'push'
        with:
          name: Pladder.app
          path: dist/Pladder.app
      - uses: actions/cache/save@v6
        # Only main writes the cache, so pull requests share one and cannot
        # evict it with their own.
        if: github.event_name == 'push' && steps.cache.outputs.cache-hit != 'true'
        with:
          path: *deps
          key: swiftpm-deps-${{ hashFiles('Package.resolved') }}
