name: CI

# `paths` with negations rather than `paths-ignore`: GitHub documents the `!`
# re-include only for `paths`, and this is what makes an edit to this file
# run CI while the rest of .github and the docs do not. Later patterns win.
on:
  push:
    branches: [main]
    paths:
      - '**'
      - '!docs/**'
      - '!**/*.md'
      - '!LICENSE'
      - '!.github/**'
      - '.github/workflows/*.yml'
  pull_request:
    paths:
      - '**'
      - '!docs/**'
      - '!**/*.md'
      - '!LICENSE'
      - '!.github/**'
      - '.github/workflows/*.yml'

jobs:
  build-and-test:
    # Pladder targets macOS 26 and needs Xcode 26.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26
        # The newest Xcode 26 on the runner. No fallback: building with the
        # runner's default Xcode would test a toolchain Pladder does not use.
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          test -n "$XCODE"
          sudo xcode-select -s "$XCODE"
      - name: Swift version
        run: swift --version
      - name: Build
        # Warnings in Pladder's own sources fail the build; the dependencies'
        # are theirs to fix.
        run: |
          set -o pipefail
          swift build 2>&1 | tee build.log
          if grep -E "^$PWD/Sources/.*warning:" build.log; then exit 1; fi
      - name: Test
        run: swift test
      - name: Scripts never stop every Pladder
        # The developer dictates with a running copy while scripts run; a
        # bare kill by name would stop it mid-recording (see CLAUDE.md).
        run: |
          # Commands only: a comment may name what not to do.
          if grep -rnE '^[^#]*(pkill -x Pladder|killall Pladder)' scripts; then exit 1; fi
      - name: Bundle
        # No CODESIGN_IDENTITY on purpose: the runner has no certificate, so
        # this runs the auto-detection and its ad-hoc fallback, which once
        # ended the script silently on a Mac without a certificate.
        run: ./scripts/bundle.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Pladder.app
          path: dist/Pladder.app
