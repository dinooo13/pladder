name: CI

# Only the paths the build and the bundle read, so a change that cannot alter
# the result starts no macOS runner. release.yml's source check has the same
# list without the two CI files; change both.
on:
  push:
    branches: [main]
    paths:
      - 'Sources/**'
      - 'Tests/**'
      - 'Package.swift'
      - 'Package.resolved'
      - 'scripts/bundle.sh'
      - 'scripts/Pladder.entitlements'
      - 'Assets/**'
      - '.github/workflows/ci.yml'
      - '.github/actions/build-and-test/**'
  pull_request:
    paths:
      - 'Sources/**'
      - 'Tests/**'
      - 'Package.swift'
      - 'Package.resolved'
      - 'scripts/bundle.sh'
      - 'scripts/Pladder.entitlements'
      - 'Assets/**'
      - '.github/workflows/ci.yml'
      - '.github/actions/build-and-test/**'

jobs:
  build-and-test:
    # Pladder targets macOS 26 and needs Xcode 26.
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-and-test
        timeout-minutes: 30
      - name: Bundle
        # No CODESIGN_IDENTITY on purpose: the runner has no certificate, so
        # this runs the auto-detection and its ad-hoc fallback, which once
        # ended the script silently on a Mac without a certificate.
        run: ./scripts/bundle.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Pladder.app
          path: dist/Pladder.app
