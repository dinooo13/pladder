name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    # SpeakUp targets macOS 26 and needs Xcode 26.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26
        run: sudo xcode-select -s /Applications/Xcode_26.app || true
      - name: Swift version
        run: swift --version
      - name: Build
        run: swift build
      - name: Test
        run: swift test
      - name: Bundle (ad-hoc signed)
        run: CODESIGN_IDENTITY=- ./scripts/bundle.sh
      - uses: actions/upload-artifact@v4
        with:
          name: SpeakUp.app
          path: dist/SpeakUp.app
