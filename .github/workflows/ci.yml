name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '.github/**'
      - '!.github/**/*.yml'
      - 'README.md'
      - 'LICENSE'
      - '**/*.md'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '.github/**'
      - '!.github/**/*.yml'
      - 'README.md'
      - 'LICENSE'
      - '**/*.md'

jobs:
  build-and-test:
    # Pladder targets macOS 26 and needs Xcode 26.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26
        run: sudo xcode-select -s /Applications/Xcode_26.app || true
      - name: Swift version
        run: swift --version
      - name: Build
        run: swift build
      - name: Test
        run: swift test
      - name: Bundle (ad-hoc signed)
        run: CODESIGN_IDENTITY=- ./scripts/bundle.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Pladder.app
          path: dist/Pladder.app
