name: Scripts

# No paths filter, so the check can be required on main: it takes seconds.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  scripts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Scripts never stop every Pladder
        # The developer dictates with a running copy while scripts run; a
        # bare kill by name would stop it mid-recording (see CLAUDE.md).
        run: |
          # Commands only: a comment may name what not to do.
          if grep -rnE '^[^#]*(pkill -x Pladder|killall Pladder)' scripts; then exit 1; fi
      - name: Every script answers --help and does nothing else
        # One that builds, launches or records before reading --help fails
        # here: on the 5 s timeout, on a missing say or screencapture, or on
        # the files it leaves behind.
        run: |
          for file in scripts/*; do
            if [[ -x "$file" && "$file" != *.sh ]]; then
              echo "::error file=$file::$file is executable but not a .sh, so no --help check covers it"
              exit 1
            fi
          done
          count=0
          for script in scripts/*.sh; do
            count=$((count + 1))
            if [[ ! -x "$script" ]]; then
              echo "::error file=$script::$script is not executable"
              exit 1
            fi
            for args in "--help" "-h" "x --help"; do
              read -r -a argv <<<"$args"
              if ! out=$(timeout 5 "$script" "${argv[@]}" 2>&1); then
                echo "::error file=$script::$script $args did not exit 0"
                echo "$out"
                exit 1
              fi
              if ! grep -q "^Usage: $script" <<<"$out"; then
                echo "::error file=$script::$script $args printed no \"Usage: $script\" line"
                echo "$out"
                exit 1
              fi
            done
          done
          if [[ -n "$(git status --porcelain --ignored)" ]]; then
            echo "::error::a --help run left files behind"
            git status --porcelain --ignored
            exit 1
          fi
          echo "$count scripts answer --help"
      - name: lock.sh holds one run at a time and gives the lock back
        run: |
          export PLADDER_LOCK_DIR="$RUNNER_TEMP/locks"
          mkdir -p "$PLADDER_LOCK_DIR"
          L=scripts/lock.sh
          LOCK="$PLADDER_LOCK_DIR/pladder-ane.lock"
          fail() { echo "::error file=$L::$*"; exit 1; }
          taken() {
            for _ in $(seq 50); do
              if grep -q '^command-pid=' "$LOCK/owner" 2>/dev/null; then return 0; fi
              sleep 0.1
            done
            fail "the lock was never taken"
          }

          s=0; "$L" ane -- sh -c 'exit 7' || s=$?
          [[ $s -eq 7 ]] || fail "a command's exit 7 came back as $s"
          [[ ! -e "$LOCK" && "$("$L" --status ane)" == "ane: free" ]] || fail "a failed command left the lock held"

          "$L" ane -- sh -c 'echo a >>"$1"; sleep 2; echo b >>"$1"' sh "$RUNNER_TEMP/order" & first=$!
          taken
          status=$("$L" --status ane)
          for part in "held by $PWD" "pid $first" "sh -c echo a"; do
            grep -qF "$part" <<<"$status" || fail "--status says \"$status\", without \"$part\""
          done
          s=0; "$L" --wait 0 ane -- true || s=$?
          [[ $s -eq 75 ]] || fail "--wait 0 on a held lock exited $s, not 75"
          "$L" ane -- sh -c 'echo c >>"$1"; echo d >>"$1"' sh "$RUNNER_TEMP/order"
          wait "$first"
          [[ "$(paste -s -d ' ' "$RUNNER_TEMP/order")" == "a b c d" ]] || fail "two runs interleaved: $(paste -s -d ' ' "$RUNNER_TEMP/order")"

          sh -c 'exit 0' & dead=$!; wait "$dead"
          mkdir "$LOCK"
          printf 'pid=%s\nstarted=Mon Jan  1 00:00:00 2000\n' "$dead" >"$LOCK/owner"
          grep -q "left by pid $dead (gone)" <<<"$("$L" --status ane)" || fail "--status missed a gone holder"
          "$L" --wait 5 ane -- true || fail "a gone holder's lock was not taken over"
          [[ ! -e "$LOCK" && ! -e "$LOCK.takeover" ]] || fail "the takeover left a lock behind"

          mkdir "$LOCK"
          echo "measuring by hand" >"$LOCK/owner"
          s=0; "$L" --wait 2 ane -- true || s=$?
          [[ $s -eq 75 && -f "$LOCK/owner" ]] || fail "a lock taken by hand was taken over (exit $s)"
          grep -q "held by hand: measuring by hand" <<<"$("$L" --status ane)" || fail "--status missed a lock taken by hand"
          rm -r "$LOCK"

          "$L" ane -- sleep 2 & held=$!
          taken
          kill -TERM "$held"
          s=0; wait "$held" || s=$?
          [[ $s -eq 143 && ! -e "$LOCK" ]] || fail "SIGTERM exited $s and left the lock: $(ls "$PLADDER_LOCK_DIR")"

          timeout 10 "$L" screen -- "$L" screen -- true || fail "a lock.sh inside the same lock did not just run"
          [[ "$("$L" ane -- sh -c 'printf "%s\n" "$1"' sh --help)" == "--help" ]] || fail "--help after -- did not reach the command"

          mkdir "$LOCK" "$LOCK.takeover"
          printf 'pid=%s\nstarted=Mon Jan  1 00:00:00 2000\n' "$dead" >"$LOCK/owner"
          s=0; timeout 10 "$L" --wait 2 ane -- true || s=$?
          [[ $s -eq 75 ]] || fail "a fresh takeover left by another run did not end in the wait's timeout (exit $s)"
          touch -t 200001010000 "$LOCK.takeover"
          "$L" --wait 5 ane -- true || fail "a takeover left over a minute ago was not cleared"
          [[ ! -e "$LOCK" && ! -e "$LOCK.takeover" ]] || fail "a stale takeover left a lock behind"
          echo "lock.sh: exit codes, --status, order, --wait 0, takeover, by hand, SIGTERM, nesting, a stale takeover"
      - name: test-copy.sh picks a chord the copy in use never reacts to
        run: |
          fail() { echo "::error file=scripts/test-copy.sh::$*"; exit 1; }
          home() { # <name> <settings.json or nothing>
            h="$RUNNER_TEMP/homes/$1"
            mkdir -p "$h/Library/Application Support/Pladder"
            if [[ -n "$2" ]]; then printf '%s' "$2" >"$h/Library/Application Support/Pladder/settings.json"; fi
            echo "$h"
          }
          expect() { # <name> <settings.json or nothing> <keyCodes>
            out=$(HOME=$(home "$1" "$2") scripts/test-copy.sh --dry-run) || fail "$1: exited non-zero"
            grep -qF "\"hotkey\":{\"keyCodes\":[$3]}" <<<"$out" || fail "$1: wanted [$3], got $out"
          }
          expect none "" "17,55,58,59"
          expect defaults '{"hotkey":{"keyCodes":[49,58]},"toggleHotkey":{"keyCodes":[]},"submitKey":{"keyCodes":[9]}}' "17,55,58,59"
          expect fn-hold '{"hotkey":{"keyCodes":[63]},"toggleHotkey":{"keyCodes":[49,58]},"submitKey":{"keyCodes":[59]}}' "17,55,58,59"
          expect right-command '{"hotkey":{"keyCodes":[54]}}' "17,56,58,59"
          expect taken '{"hotkey":{"keyCodes":[17,55,58,59]}}' "5,55,58,59"
          for bad in '{"hotkey":' '{"hotkey":{"kind":"modifier","keyCode":54}}' '[]'; do
            if HOME=$(home bad "$bad") scripts/test-copy.sh --dry-run >/dev/null 2>&1; then fail "launched on $bad"; fi
          done
          echo "test-copy.sh: chords for no file, the defaults, fn, Right Command and a taken T; unreadable files refused"
      - name: ShellCheck
        run: shellcheck scripts/*.sh
