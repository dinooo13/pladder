name: Docs

# No paths filter, so the check can be required on main: it takes seconds.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  doc-pointers:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Comments point at headings that exist
        run: ./scripts/check-doc-pointers.sh
      - name: The site's numbers match the docs
        run: ./scripts/check-site-numbers.sh
